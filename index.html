<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prototipo de Plataformas 2D</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="960" height="540"></canvas>
    <p class="hint">
      Mover: <b>← →</b> o <b>A / D</b> &nbsp;·&nbsp;
      Saltar: <b>Espacio</b> o <b>W / ↑</b> &nbsp;·&nbsp;
      Dash: <b>Shift</b> o <b>L</b> &nbsp;·&nbsp;
      Atacar: <b>J</b> o <b>X</b> &nbsp;·&nbsp;
      Tienda: <b>K</b> &nbsp;·&nbsp;
      Menú: <b>M</b> &nbsp;·&nbsp;
      Reintentar: <b>Enter</b>
    </p>
  </div>
  <script src="game.js"></script>
</body>
</html>
